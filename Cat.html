<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Surprise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');
       
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Comic Neue', cursive;
            overflow: hidden;
            position: relative;
        }
        .header-text {
            font-size: 2.8rem;
            color: #333;
            text-shadow: 3px 3px 0px #fff;
            margin-bottom: 20px;
        }
        #main-cat {
            width: 320px;
            height: 320px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }
        #main-cat:active {
            transform: scale(1.15);
        }
        .instruction {
            margin-top: 25px;
            font-size: 1.3rem;
            color: #444;
            text-align: center;
            max-width: 500px;
        }
        #start-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.2rem;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .status {
            margin-top: 15px;
            font-size: 1rem;
            color: #333;
        }
    </style>
</head>
<body>
    <h1 class="header-text">Hi there! 👋</h1>
    <div>
        <img id="main-cat" src="https://picsum.photos/id/237/600/600" alt="Cute Cat">
    </div>
    <p class="instruction">
        Hold <strong>SPACE</strong> for 5 seconds<br>
        <strong>OR</strong> tap the cat on mobile<br><br>
        <strong>Do both</strong> to unlock the secret!
    </p>

    <button id="start-btn">🚀 Start Nyan Invasion</button>
    <p class="status" id="status"></p>

    <!-- Rickroll Overlay -->
    <div class="overlay" id="overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000;"></div>
    <iframe id="rick-video" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:90%; max-width:850px; z-index:1001;" 
            src="" title="Never Gonna Give You Up" frameborder="0" allowfullscreen></iframe>

    <script>
        let spaceHeldStart = null;
        let spaceHeldLongEnough = false;
        let catTapped = false;
        let popupsEnabled = false;
        let popupCount = 0;
        const MAX_POPUPS = 8; // Safety limit

        const mainCat = document.getElementById('main-cat');
        const rickVideo = document.getElementById('rick-video');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status');

        function showRickroll() {
            overlay.style.display = 'block';
            rickVideo.style.display = 'block';
            rickVideo.src = "https://www.youtube.com/embed/dQw4w9wgxcq?autoplay=1";
        }

        function closeRickroll() {
            rickVideo.style.display = 'none';
            overlay.style.display = 'none';
            rickVideo.src = "";
        }
        overlay.addEventListener('click', closeRickroll);

        // Space Bar
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && !spaceHeldStart) spaceHeldStart = Date.now();
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === ' ') {
                if (spaceHeldStart && Date.now() - spaceHeldStart >= 5000) {
                    spaceHeldLongEnough = true;
                    checkSecretUnlock();
                }
                spaceHeldStart = null;
            }
        });

        // Tap Cat
        mainCat.addEventListener('click', () => {
            catTapped = true;
            checkSecretUnlock();
            mainCat.style.transform = 'scale(1.3)';
            setTimeout(() => mainCat.style.transform = 'scale(1)', 200);
        });

        function checkSecretUnlock() {
            if (spaceHeldLongEnough && catTapped) showRickroll();
        }

        // ==================== POPUP FUNCTION ====================
        function openNyanPopup() {
            if (!popupsEnabled || popupCount >= MAX_POPUPS) return;
            
            popupCount++;
            const width = 240;
            const height = 180;
            const left = Math.random() * (screen.availWidth - width);
            const top = Math.random() * (screen.availHeight - height - 100);

            const isVideoPopup = Math.random() < 0.55; // 55% chance video popup

            let url = '';
            let title = '';

            if (isVideoPopup) {
                // Random between Nyan Cat and Rickroll
                if (Math.random() < 0.7) {
                    url = "https://www.youtube.com/embed/6b3k6o4z4Y8?autoplay=1&loop=1&playlist=6b3k6o4z4Y8"; // Nyan Cat
                    title = "Nyan Cat";
                } else {
                    url = "https://www.youtube.com/embed/dQw4w9wgxcq?autoplay=1"; // Rickroll
                    title = "Never Gonna Give You Up";
                }
            } else {
                // Moving GIF popup
                url = '';
            }

            const popup = window.open('', '_blank', 
                `width=${width},height=${height},left=${Math.floor(left)},top=${Math.floor(top)},resizable=no`);

            if (popup) {
                if (isVideoPopup) {
                    // YouTube Video Popup
                    popup.document.write(`
                        <!DOCTYPE html>
                        <html><head><title>${title}</title>
                        <style>body{margin:0;overflow:hidden;background:#000;}</style>
                        </head><body>
                            <iframe width="100%" height="100%" src="${url}" 
                            frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        </body></html>
                    `);
                } else {
                    // Moving Nyan Cat GIF
                    popup.document.write(`
                        <!DOCTYPE html>
                        <html><head><title>Nyan Cat</title>
                        <style>
                            body{margin:0;overflow:hidden;background:#000;}
                            img{width:100%;height:100%;object-fit:contain;}
                            .close-btn{position:absolute;top:5px;right:8px;background:red;color:white;
                            width:25px;height:25px;border-radius:50%;font-size:18px;display:flex;
                            align-items:center;justify-content:center;cursor:pointer;z-index:10;}
                        </style>
                        </head><body>
                            <div class="close-btn">×</div>
                            <img src="https://cataas.com/cat/gif" alt="Nyan Cat">
                            <script>
                                let dx = (Math.random()-0.5)*12 + 5;
                                let dy = (Math.random()-0.5)*12 + 5;
                                function move() {
                                    let x = window.screenX + dx;
                                    let y = window.screenY + dy;
                                    if (x <= 0 || x >= screen.width-${width}) dx *= -1;
                                    if (y <= 30 || y >= screen.height-${height}) dy *= -1;
                                    window.moveTo(x, y);
                                    requestAnimationFrame(move);
                                }
                                document.querySelector('.close-btn').onclick = () => window.close();
                                window.onbeforeunload = () => { if(window.opener) window.opener.postMessage('nyan-closed','*'); };
                                move();
                            <\/script>
                        </body></html>
                    `);
                }
                popup.document.close();
            }
        }

        // Duplicate when closed
        window.addEventListener('message', (e) => {
            if (e.data === 'nyan-closed') {
                popupCount = Math.max(0, popupCount - 1);
                setTimeout(openNyanPopup, 250);
            }
        });

        // Start Button
        startBtn.addEventListener('click', () => {
            popupsEnabled = true;
            startBtn.style.display = 'none';
            statusText.textContent = "Nyan Cats & Rickrolls incoming... 🎵🐱";

            // Faster spawning
            setTimeout(() => openNyanPopup(), 100);
            setTimeout(() => openNyanPopup(), 400);
            setTimeout(() => openNyanPopup(), 700);
            setTimeout(() => openNyanPopup(), 1100);
        });

        // Bonus clicks
        document.body.addEventListener('click', (e) => {
            if (popupsEnabled && e.target.id !== 'main-cat' && Math.random() > 0.5) {
                openNyanPopup();
            }
        });
    </script>
</body>
</html>
